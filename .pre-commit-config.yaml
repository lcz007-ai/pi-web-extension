# 提交前密钥扫描（gitleaks）
#
# 依赖：gitleaks 需已安装并在 PATH
#   本机安装位置：%LOCALAPPDATA%\Python\bin\gitleaks.exe
# 启用：pre-commit install
# 手动全量扫描：pre-commit run --all-files   （或直接 gitleaks git --redact -v）
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks（密钥扫描）
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
